<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cash Per Minute</title>
<style>
:root{color-scheme:dark;--bg:#06120a;--card:#0d1f13;--line:rgba(125,255,142,.16);--mint:#7dff8e;--text:#eaf7ee;--muted:#8aa595;--red:#ff6b6b;--ink:#06240f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background:radial-gradient(120% 60% at 50% -10%,#1f6b38 0%,#0b2a16 45%,var(--bg) 80%) no-repeat,var(--bg);background-color:var(--bg)}
.app{width:100%;max-width:420px;padding:22px 16px 110px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.top p{margin:0;font-size:13px;color:var(--muted)}
.top h1{margin:2px 0 0;font-size:24px;letter-spacing:-.01em}
.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;background:linear-gradient(145deg,#12301c,#07150c);border:1px solid var(--line);box-shadow:0 0 22px rgba(125,255,142,.25)}
.hero{border-radius:26px;padding:20px;color:var(--ink);background:linear-gradient(135deg,#d3ffd9 0%,#7af592 55%,#4fdc70 100%);box-shadow:0 12px 40px rgba(80,230,120,.22)}
.hero .l{font-size:13px;font-weight:600;opacity:.75}
.total{font-size:42px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0 16px;word-break:break-all}
.pills{display:flex;gap:10px}
.pill{flex:1;display:flex;align-items:center;gap:10px;background:#07150c;color:var(--text);border-radius:16px;padding:10px 12px;border:1px solid var(--line)}
.pill i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#12301c;color:var(--mint);font-style:normal;font-size:14px}
.pill small{display:block;font-size:11px;color:var(--muted)}
.pill b{font-size:15px;font-variant-numeric:tabular-nums}
.glass{margin-top:14px;background:linear-gradient(160deg,#0f2b19,#07140b);border:1px solid var(--line);border-radius:22px;padding:18px;text-align:center;box-shadow:inset 0 0 30px rgba(125,255,142,.05)}
.glass .l{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.time{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:4px}
.time small{font-size:24px;color:var(--mint)}
.btns{display:flex;gap:10px;margin:14px 0 22px}
.btn{flex:1;padding:16px;border-radius:18px;border:1px solid var(--line);font-size:16px;font-weight:700;cursor:pointer;background:var(--card);color:var(--text)}
.btn.go{border:0;background:linear-gradient(135deg,#b6ffbe,#6ef28a);color:var(--ink);box-shadow:0 0 26px rgba(110,242,138,.35)}
.btn.go.run{background:linear-gradient(135deg,#ff9a9a,#ff6b6b);color:#2a0505;box-shadow:0 0 26px rgba(255,107,107,.3)}
.sh{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
.sh h2{margin:0;font-size:19px}
.lnk{border:0;background:none;color:var(--mint);font-size:13px;font-weight:600;cursor:pointer}
.list{margin:0 0 6px;padding:0;list-style:none}
.sr{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:8px}
.sr.on{border-color:var(--mint);box-shadow:0 0 18px rgba(125,255,142,.28)}
.sr i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#12301c;color:var(--mint);font-style:normal;font-weight:700;font-size:14px;flex:none}
.m{flex:1;font-weight:700;font-size:15px;min-width:0}
.m small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.g{color:var(--mint)}
.sr input{width:92px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:#06120a;color:var(--text);font-size:16px;text-align:right}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px}
.note{font-size:12px;color:var(--muted);margin:2px 2px 24px}
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));right:max(18px,calc(50% - 192px));width:58px;height:58px;border-radius:50%;border:0;font-size:30px;line-height:1;cursor:pointer;color:var(--ink);background:linear-gradient(135deg,#b6ffbe,#5fe67c);box-shadow:0 0 28px rgba(110,242,138,.5)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><p>Now watch your cash every minute</p><h1>Cash Per Minute</h1></div>
    <div class="logo">💸</div>
  </div>

  <div class="hero">
    <div class="l">Total Cash</div>
    <div class="total" id="total">Rs 0.00</div>
    <div class="pills">
      <div class="pill"><i>↗</i><div><small>Rate now</small><b id="now">Rs 8/min</b></div></div>
      <div class="pill"><i>⏱</i><div><small>Minute</small><b id="minnow">1</b></div></div>
    </div>
  </div>

  <div class="glass">
    <div class="l">Stopwatch</div>
    <div class="time"><span id="hms">00:00:00</span><small id="cs">.00</small></div>
  </div>

  <div class="btns">
    <button class="btn go" id="go">▶ Start</button>
    <button class="btn" id="reset">Reset</button>
  </div>

  <div class="sh"><h2>Rate per minute</h2></div>
  <ul class="list" id="sched"></ul>
  <p class="note">After the last minute in the list, the last rate keeps running. Tap + to add a minute.</p>

  <div class="sh"><h2>Memory</h2><button class="lnk" id="clr">Clear all</button></div>
  <ul class="list" id="mem"></ul>
  <p class="note" id="memnote"></p>
</div>
<button class="fab" id="add" aria-label="Add minute">+</button>

<script>
var $=function(i){return document.getElementById(i)};
var rates=[8,9,10,11,12],running=false,elapsed=0,last=0,curMin=-1;
function pad(n){return (n<10?"0":"")+n}
function fmt(n){return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function rateAt(i){return rates.length?rates[Math.min(i,rates.length-1)]:0}
function earnedAt(ms){
  var full=Math.floor(ms/60000),rem=ms%60000,sum=0,n=rates.length,i;
  for(i=0;i<Math.min(full,n);i++)sum+=rates[i];
  if(full>n&&n)sum+=(full-n)*rates[n-1];
  return sum+rateAt(full)*rem/60000;
}
function build(){
  var ul=$("sched");ul.innerHTML="";
  rates.forEach(function(r,i){
    var li=document.createElement("li");li.className="sr";
    li.innerHTML='<i>'+(i+1)+'</i><div class="m">Minute '+(i+1)+'<small>Rs per minute</small></div><input type="number" inputmode="decimal" step="any" value="'+r+'"><button class="x" aria-label="Remove">×</button>';
    li.querySelector("input").oninput=function(e){rates[i]=parseFloat(e.target.value)||0;render()};
    li.querySelector(".x").onclick=function(){rates.splice(i,1);curMin=-1;build();render()};
    ul.appendChild(li);
  });
  curMin=-1;
}
function render(){
  var t=elapsed/1000;
  var h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=Math.floor(t%60),cs=Math.floor(elapsed%1000/10);
  $("hms").textContent=pad(h)+":"+pad(m)+":"+pad(s);
  $("cs").textContent="."+pad(cs);
  $("total").textContent="Rs "+fmt(earnedAt(elapsed));
  var mi=Math.floor(elapsed/60000);
  $("now").textContent="Rs "+rateAt(mi)+"/min";
  $("minnow").textContent=mi+1;
  if(mi!==curMin){
    curMin=mi;
    var rows=$("sched").children,k;
    for(k=0;k<rows.length;k++)rows[k].classList.toggle("on",k===Math.min(mi,rows.length-1));
  }
}
function tick(){
  if(!running)return;
  var now=performance.now();elapsed+=now-last;last=now;
  render();requestAnimationFrame(tick);
}
$("go").onclick=function(){
  running=!running;
  $("go").textContent=running?"⏸ Pause":"▶ Start";
  $("go").classList.toggle("run",running);
  if(running){last=performance.now();tick();}
};
$("reset").onclick=function(){
  if(elapsed>=1000)saveSession();
  running=false;elapsed=0;curMin=-1;
  $("go").textContent="▶ Start";$("go").classList.remove("run");render();
};
$("add").onclick=function(){rates.push(rates.length?rates[rates.length-1]+1:8);build();render()};
var mem=[];
try{mem=JSON.parse(localStorage.getItem("pm_mem")||"[]")}catch(e){mem=[]}
function persist(){try{localStorage.setItem("pm_mem",JSON.stringify(mem))}catch(e){}}
function dur(ms){var t=Math.floor(ms/1000);return pad(Math.floor(t/3600))+":"+pad(Math.floor(t%3600/60))+":"+pad(t%60)}
function saveSession(){mem.unshift({ts:Date.now(),ms:elapsed,cash:earnedAt(elapsed)});mem=mem.slice(0,100);persist();drawMem()}
function drawMem(){
  var ul=$("mem"),tot=0;ul.innerHTML="";
  mem.forEach(function(r,i){
    tot+=r.cash;
    var li=document.createElement("li"),d=new Date(r.ts);li.className="sr";
    li.innerHTML='<i>✓</i><div class="m"><span class="g">+Rs '+fmt(r.cash)+'</span><small>'+dur(r.ms)+' · '+d.toLocaleDateString()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+'</small></div><button class="x" aria-label="Remove">×</button>';
    li.querySelector(".x").onclick=function(){mem.splice(i,1);persist();drawMem()};
    ul.appendChild(li);
  });
  $("memnote").textContent=mem.length?mem.length+(mem.length===1?" countdown":" countdowns")+" · Total Rs "+fmt(tot):"No countdowns saved yet. Press Reset to save one.";
}
$("clr").onclick=function(){mem=[];persist();drawMem()};
build();render();drawMem();
</script>
</body>
</html>
